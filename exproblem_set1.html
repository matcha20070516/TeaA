<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>謎検模試</title>
  <link rel="stylesheet" href="exproblem_set1.css">
</head>
<body>
  <div class="main-container">
    <div class="header">
      <div id="question-num">第1問</div>
      <div id="timer">30:00</div>
      <button id="toggle-chapters" class="mobile-only">チャプター表示</button>
    </div>

    <div class="content-area">
      <div id="chapters" class="chapters hidden-on-mobile"></div>

      <div class="question-area">
        <div class="image-wrapper">
          <img id="quiz-img" src="mq1.png" alt="問題画像">
          <canvas id="draw-layer"></canvas>
        </div>

        <div class="answer-section">
          <input type="text" id="answer" placeholder="答えを入力">
          <span id="answer-format-label">（形式: ひらがな）</span>
          <div id="format-warning" class="warning"></div>
        </div>

        <div class="navigation">
          <button id="back-btn">◁ 戻る</button>
          <button id="forward-btn">次へ ▷</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 確認用モーダル -->
  <div id="confirm-overlay">
    <div class="confirm-box">
      <p>試験を終了しますか？</p>
      <button id="confirm-yes">はい</button>
      <button id="confirm-no">いいえ</button>
    </div>
  </div>

  <script src="exproblem_set1.js"></script>
</body>
</html>
