    /* ============================================
       修正2: PC表示時の縦長問題を解決
       - 画面高さに収まるレイアウトに変更
       - max-heightとoverflowで制御
    ============================================ */
    * {
      box-sizing: border-box;

```
body {
  margin: 0;
  padding: 0;
  font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  background: #f6f8fb;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-y: auto;
}

.container {
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
  padding: 20px;
  width: 95%;
  max-width: 800px;
  text-align: center;
  position: relative;
  /* PC表示時に画面高さに収める */
  max-height: 95vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.timer {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 1.2em;
  color: #444;
  font-weight: bold;
  z-index: 10;
}

#question-num {
  margin-bottom: 10px;
  margin-top: 5px;
  color: #666;
  font-size: 1.1em;
}

.chapters {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  margin-bottom: 12px;
  padding-bottom: 4px;
  flex-shrink: 0;
}

.chapters::-webkit-scrollbar {
  height: 6px;
}

.chapters::-webkit-scrollbar-thumb {
  background-color: rgba(0,0,0,0.2);
  border-radius: 3px;
}

.chapter-btn {
  flex: 0 0 auto;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background-color: #eee;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.9em;
}

.chapter-btn:hover {
  transform: scale(1.05);
}

.chapter-btn.current {
  background-color: #5da3fa;
  color: white;
}

.chapter-btn.answered {
  background-color: #4caf50;
  color: white;
}

.chapter-btn.invalid {
  background-color: #e53935;
  color: white;
}

/* 問題表示エリア - スクロール可能に */
.quiz-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  min-height: 0;
  padding: 10px 0;
}

.question-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-shrink: 0;
}

#question-area {
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  border: 2px solid #555;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
}

img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.nav-btn {
  font-size: 2em;
  color: #5da3fa;
  cursor: pointer;
  user-select: none;
  transition: color 0.2s;
  flex-shrink: 0;
}

.nav-btn:hover {
  color: #3d8de0;
}

/* 解答エリア */
.answer-area {
  flex-shrink: 0;
  width: 100%;
  padding: 10px 0;
}

.answer-container {
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}

input[type="text"] {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  font-size: 1.1em;
  border: 1px solid #ccc;
  border-radius: 8px;
  transition: all 0.3s ease;
}

input[type="text"]:focus {
  outline: none;
  border-color: #5da3fa;
  box-shadow: 0 0 0 3px rgba(93, 163, 250, 0.1);
}

input[type="text"]:disabled {
  background-color: #f0f0f0;
  color: #999;
}

.submit-area {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 500px;
  margin: 0 auto;
}

.format-hint {
  color: #666;
  font-size: 0.9em;
}

.submit-btn {
  background-color: #e53935;
  color: white;
  border: none;
  padding: 8px 16px;
  font-size: 1em;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s;
  flex-shrink: 0;
}

.submit-btn:hover {
  background-color: #c62828;
}

/* モーダル */
#confirm-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: white;
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.modal-content p {
  margin-bottom: 20px;
  font-size: 1.1em;
}

.modal-content button {
  margin: 0 8px;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1em;
}

#confirm-yes {
  background-color: #e53935;
  color: white;
}

#confirm-yes:hover {
  background-color: #c62828;
}

#confirm-no {
  background-color: #eee;
  color: #333;
}

#confirm-no:hover {
  background-color: #ddd;
}

/* レスポンシブ対応 */
@media (max-width: 600px) {
  .container {
    padding: 15px;
    max-height: 98vh;
  }

  #question-area {
    max-width: 100%;
  }

  input[type="text"] {
    font-size: 1em;
  }

  .nav-btn {
    font-size: 1.5em;
  }

  .timer {
    font-size: 1em;
    right: 10px;
  }
}

@media (min-width: 601px) and (max-width: 1024px) {
  .container {
    max-width: 700px;
    padding: 25px;
  }

  #question-area {
    max-width: 450px;
  }
}

@media (min-width: 1025px) {
  .container {
    max-width: 900px;
    padding: 30px 40px;
    max-height: 90vh;
  }

  #question-area {
    max-width: 600px;
  }

  input[type="text"] {
    font-size: 1.2em;
  }
}
```
